services:
  planet-core:
    build:
      context: ./planet-core
    container_name: planet-core
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      PLANET_DATA_DIR: /data
    volumes:
      - planet-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  planet-data:
    name: planet-data
